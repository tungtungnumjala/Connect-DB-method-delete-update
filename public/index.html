<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Course Management</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f4f6fa;
        color: #1e293b;
      }
      main {
        max-width: 860px;
        margin: auto;
      }
      section {
        background: white;
        padding: 22px;
        margin: 18px 0;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 6px;
        flex: 1;
        min-width: 150px;
      }
      input {
        padding: 10px;
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
      }
      button {
        border: 0;
        padding: 11px 16px;
        border-radius: 6px;
        color: white;
        background: #2563eb;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
      button.danger {
        background: #dc2626;
      }
      td button {
        padding: 6px 10px;
      }
      #refresh-button {
        background: #475569;
      }
      #status {
        padding: 12px;
        border-radius: 6px;
        background: #e2e8f0;
      }
      #status.success {
        background: #dcfce7;
        color: #166534;
      }
      #status.error {
        background: #fee2e2;
        color: #991b1b;
      }
      #status.loading {
        background: #dbeafe;
        color: #1e40af;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 14px;
      }
      th,
      td {
        padding: 11px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
      }
      .heading-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
    </style>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Course Management</h1>
      <p>Web–Database Integration: Express + PostgreSQL</p>
      <div id="status" role="status" aria-live="polite">Ready</div>
      <!-- input เพื่อ adminkey -> Authentication -->
      <section>
        <label
          >Admin Key (จำเป็นสำหรับ Edit/Delete)
          <input id="admin-key" type="password" autocomplete="off" />
        </label>
      </section>
      <section>
        <h2>Add New Course</h2>
        <form id="course-form">
          <label
            >Course Name
            <input
              id="course-name"
              type="text"
              maxlength="150"
              required
              placeholder="e.g. Web Programming"
            />
          </label>
          <label
            >Credits
            <input
              id="course-credits"
              type="number"
              min="1"
              max="6"
              step="1"
              value="3"
              required
            />
          </label>
          <button id="add-button" type="submit">Add Course</button>
          <button id="cancel-button" type="button" hidden>Cancel</button>
        </form>
      </section>
      <section>
        <div class="heading-row">
          <h2>Available Courses</h2>
          <button id="refresh-button" type="button">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Course Name</th>
              <th>Credits</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="course-list"></tbody>
        </table>
        <p id="empty-message" hidden>No courses found.</p>
      </section>
    </main>
  </body>
</html>
